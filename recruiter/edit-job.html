<!DOCTYPE html>
<html>
<head>
  <title>Edit Job</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <span style="color:#1a4f9c;">AIUB Placement Hub</span>
    <span>
      <a href="companies.html">Job Search</a>
      <a href="#">AIUB Website</a>
      <a href="#">Notifications</a>
    </span>
  </div>

  <div class="menu">
    <a href="my-jobs.html">HOME</a>
    <a href="my-jobs.html">MY JOBS</a>
    <a href="post-job.html">POST A JOB</a>
    <div class="logo"><img src="logo.png" alt="AIUB logo"></div>
    <a href="companies.html">COMPANIES</a>
    <a href="#">MY ACCOUNT</a>
  </div>

  <div class="box">
    <p class="label">RECRUITER</p>
    <h1>Edit Job</h1>

    <form class="card" action="my-jobs.html">
      <label>Job Title</label>
      <input type="text" name="title" value="Web Developer">

      <label>Company Name</label>
      <input type="text" name="company" value="BrightSoft Ltd.">

      <label>Job Type</label>
      <select name="type">
        <option selected>Full-time</option>
        <option>Part-time</option>
        <option>Internship</option>
      </select>

      <label>Deadline</label>
      <input type="date" name="deadline" value="2026-11-30">

      <label>Description</label>
      <textarea name="description" rows="5">Make and update websites for our clients.</textarea>

      <button type="submit">Save Changes</button>
    </form>
  </div>
</body>
</html>
