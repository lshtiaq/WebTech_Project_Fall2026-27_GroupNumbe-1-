
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Edit Profile</title>
</head>

<body class="editProfileBody">
    <header class="header">
      <div class="logo-section">
        <div class="logo">
          <img src="aiub-logo.png" />
        </div>

        <div class="brand-name">
          <h1>AIUB</h1>
          <p>PLACEMENT HUB</p>
        </div>
      </div>
      <div class="user-section">
        <span>Welcome, ISHTIAQ AHMED</span>
        <a href="#">Logout</a>
      </div>
    </header>

    <div class="container">

        <h1>Edit Profile</h1>

        <form>

            <fieldset>
                <legend>Personal Information</legend>

                <table>
                    <tr>
                        <td>
                            <label for="FullName">Full Name:</label>
                        </td>
                        <td>
                            <input type="text" id="FullName"
                            name="FullName" value="Ishtiaq Ahmed">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="StudentID">Student ID:</label>
                        </td>
                        <td>
                            <input type="text" id="StudentID"
                            name="StudentID" value="24-59556-3"
                            readonly>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="Email">Email:</label>
                        </td>
                        <td>
                            <input type="email" id="Email"
                            name="Email"
                            value="24-59556-3@student.aiub.edu">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="Phone">Phone:</label>
                        </td>
                        <td>
                            <input type="tel" id="Phone"
                            name="Phone" value="01766230046">
                        </td>
                    </tr>
                </table>
            </fieldset>


            <fieldset>
                <legend>Academic Information</legend>

                <table>
                    <tr>
                        <td>
                            <label for="Department">Department:</label>
                        </td>
                        <td>
                            <select id="Department" name="Department">
                                <option value="CS" selected>CS</option>
                                <option value="CSE">CSE</option>
                                <option value="EEE">EEE</option>
                                <option value="BBA">BBA</option>
                                <option value="IPE">IPE</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="CGPA">CGPA:</label>
                        </td>
                        <td>
                            <input type="number" id="CGPA"
                            name="CGPA" value="3.75"
                            step="0.01" min="0" max="4">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="GraduationYear">
                                Graduation Year:
                            </label>
                        </td>
                        <td>
                            <input type="number" id="GraduationYear"
                            name="GraduationYear" value="2027">
                        </td>
                    </tr>
                </table>
            </fieldset>


            <fieldset>
                <legend>Career Profile</legend>

                <table>
                    <tr>
                        <td>
                            <label for="Skills">Skills:</label>
                        </td>
                        <td>
                            <input type="text" id="Skills"
                            name="Skills" value="Html">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="LinkedIn">LinkedIn:</label>
                        </td>
                        <td>
                            <input type="url" id="LinkedIn"
                            name="LinkedIn"
                            placeholder="https://linkedin.com/in/yourname">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="Bio">Short Bio:</label>
                        </td>
                        <td>
                            <textarea id="Bio" name="Bio"
                            maxlength="200"
                            placeholder="Tell recruiters about yourself"></textarea>

                            <p class="counter">0/200</p>
                        </td>
                    </tr>
                </table>
            </fieldset>


            <div class="buttons">
                <input type="submit" id="submit"
                value="Save changes">

                <input type="reset" id="reset"
                value="Cancel">
            </div>

        </form>

    </div>

</body>
</html>
