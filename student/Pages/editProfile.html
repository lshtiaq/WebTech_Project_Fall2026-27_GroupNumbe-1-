<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="D:\Documents\AIUB\Semester 7\Project\student\Design\style.css">
    <script src="D:\Documents\AIUB\Semester 7\Project\student\JS\script.js" defer></script>
    <title>Edit Profile</title>
</head>

<body class="editProfileBody">
    <header class="header">
      <div class="logo-section">
        <div class="logo">
          <img src="D:\Documents\AIUB\Semester 7\Project\student\Assets\aiub-logo.png" alt="AIUB Logo" />
        </div>

        <div class="brand-name">
          <h1>AIUB</h1>
          <p>PLACEMENT HUB</p>
        </div>
      </div>
      <div class="user-section">
        <span id="userNameHeader">Welcome, ISHTIAQ AHMED</span>
        <a href="D:\Documents\AIUB\Semester 7\Project\index.html">Logout</a>
      </div>
    </header>

    <div class="container">
        <h1>Edit Profile</h1>

        <form onsubmit="return collect_data()" novalidate>
            <fieldset>
                <legend>Personal Information</legend>

                <table>
                    <tr>
                        <td><label for="FullName">Full Name:</label></td>
                        <td>
                            <input type="text" id="FullName" name="FullName" value="Ishtiaq Ahmed">
                            <p class="validation-error" id="NameError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="StudentID">Student ID:</label></td>
                        <td>
                            <input type="text" id="StudentID" name="StudentID" value="24-59556-3" readonly>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="Email">Email:</label></td>
                        <td>
                            <input type="email" id="Email" name="Email" value="24-59556-3@student.aiub.edu">
                            <p class="validation-error" id="EmailError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="Phone">Phone:</label></td>
                        <td>
                            <input type="tel" id="Phone" name="Phone" value="01766230046">
                            <p class="validation-error" id="PhoneError"></p>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <fieldset>
                <legend>Academic Information</legend>

                <table>
                    <tr>
                        <td><label for="Department">Department:</label></td>
                        <td>
                            <select id="Department" name="Department">
                                <option value="CS" selected>CS</option>
                                <option value="CSE">CSE</option>
                                <option value="EEE">EEE</option>
                                <option value="BBA">BBA</option>
                                <option value="IPE">IPE</option>
                            </select>
                            <p class="validation-error" id="DepartmentError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="CGPA">CGPA:</label></td>
                        <td>
                            <input type="number" id="CGPA" name="CGPA" value="3.75" step="0.01" min="0" max="4">
                            <p class="validation-error" id="CGPAError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="GraduationYear">Graduation Year:</label></td>
                        <td>
                            <input type="number" id="GraduationYear" name="GraduationYear" value="2027">
                            <p class="validation-error" id="YearError"></p>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <fieldset>
                <legend>Career Profile</legend>

                <table>
                    <tr>
                        <td><label for="Skills">Skills:</label></td>
                        <td>
                            <input type="text" id="Skills" name="Skills" value="Html">
                            <p class="validation-error" id="SkillsError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="LinkedIn">LinkedIn:</label></td>
                        <td>
                            <input type="url" id="LinkedIn" name="LinkedIn" placeholder="https://linkedin.com/in/yourname">
                            <p class="validation-error" id="LinkedInError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="Bio">Short Bio:</label></td>
                        <td>
                            <textarea id="Bio" name="Bio" maxlength="200" placeholder="Tell recruiters about yourself"></textarea>
                            <p class="counter" id="BioCounter">0/200</p>
                            <p class="validation-error" id="BioError"></p>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <div class="buttons">
                <input type="submit" id="submit" value="Save changes">
                <button type="button" id="reset" onclick="cancelEdit()">Cancel</button>
            </div>
        </form>
    </div>
</body>
</html>
